server {
    listen 80;
    root /usr/share/nginx/html;

    # assignment hand-ins are up to 2 MB, a bit more once base64 encoded
    client_max_body_size 4m;

    # /api/students -> http://backend:8004/students
    location /api/ {
        proxy_pass http://backend:8004/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # built files have a content hash in their names, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the service worker must always be fetched fresh so updates reach people
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # every other path is a page of the single-page app
    location / {
        try_files $uri /index.html;
    }
}
